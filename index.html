<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#395d35" />
    <link rel="icon" href="./favicon.svg" />
    <title>Critter Safari · ספארי היצורים</title>
  </head>
  <body>
    <main id="app">
      <canvas
        id="game"
        tabindex="0"
        aria-label="קרחת היער — גררו מלכודת ומזון אל הדשא"
      ></canvas>
      <header>
        <section id="contract" lang="en" dir="ltr">
          <small>CRITTER SAFARI · <span id="chapter">FERN GARDEN</span></small>
          <h1 id="instruction"></h1>
          <p id="rescue-progress" hidden></p>
        </section>
        <div class="top-actions">
          <button id="progress" dir="ltr" aria-label="מפת השלבים">1 / 50</button
          ><button id="notes-btn" title="יומן ועזרה">יומן</button
          ><button id="pause-btn" aria-label="השהיה והגדרות">Ⅱ</button>
        </div>
      </header>
      <p id="action-prompt" role="status"></p>
      <aside id="animal-stats" aria-label="נתוני החיות">
        <strong>נתוני החיות</strong>
        <small>מהירות רגילה ללא פיתיון · מספר גבוה = מהיר יותר</small>
        <ol id="animal-facts" lang="en" dir="ltr"></ol>
      </aside>
      <div id="loading" role="status">מכינים את קרחת היער…</div>
      <div id="toast" role="status"></div>
      <aside id="capture-card" hidden></aside>
      <footer id="tray" aria-label="כלים ומזון">
        <button
          class="tool"
          id="catcher-tool"
          data-tool="catcher"
          aria-label="מלכודת — גררו אל הדשא"
        >
          <svg viewBox="0 0 72 64" aria-hidden="true">
            <defs>
              <linearGradient id="glass" x2="1" y2="1">
                <stop stop-color="#d6f6e8" stop-opacity=".85" />
                <stop offset="1" stop-color="#a9c1b8" stop-opacity=".2" />
              </linearGradient>
            </defs>
            <path
              d="M12 48a24 24 0 0 1 48 0Z"
              fill="url(#glass)"
              stroke="#668a7b"
              stroke-width="2"
            />
            <path
              d="M21 32q7-15 20-15"
              fill="none"
              stroke="#fff9d9"
              stroke-width="4"
              stroke-linecap="round"
            />
            <ellipse
              cx="36"
              cy="48"
              rx="27"
              ry="7"
              fill="#ae8b49"
              stroke="#75532c"
              stroke-width="2"
            />
            <ellipse cx="36" cy="46" rx="22" ry="4" fill="#d0b779" />
            <circle
              cx="12"
              cy="44"
              r="6"
              fill="#c4a768"
              stroke="#75532c"
              stroke-width="2"
            /></svg
          ><span>מלכודת</span></button
        ><button
          class="tool"
          id="leaf-tool"
          data-tool="leaf"
          aria-label="עלה — גררו אל הדשא"
        >
          <svg viewBox="0 0 72 64" aria-hidden="true">
            <path
              d="M14 52Q7 14 59 9Q62 51 14 52Z"
              fill="#6d9846"
              stroke="#456b31"
              stroke-width="2"
            />
            <path
              d="M13 54 53 17M27 42l-6-17M37 32l15 2M42 27l-2-11"
              fill="none"
              stroke="#c4d78b"
              stroke-width="2.5"
              stroke-linecap="round"
            /></svg
          ><span>עלה</span></button
        ><button
          class="tool"
          id="berry-tool"
          data-tool="berry"
          aria-label="פרי — גררו אל הדשא"
        >
          <svg viewBox="0 0 72 64" aria-hidden="true">
            <path
              d="M34 20q2-13 15-13"
              fill="none"
              stroke="#547537"
              stroke-width="4"
            />
            <path d="M36 17q-13-14-20-4 4 11 20 4" fill="#739b48" />
            <g fill="#9e4962" stroke="#78394b" stroke-width="1.5">
              <circle cx="29" cy="30" r="9" />
              <circle cx="43" cy="30" r="9" />
              <circle cx="22" cy="42" r="9" />
              <circle cx="36" cy="42" r="10" />
              <circle cx="49" cy="42" r="9" />
              <circle cx="29" cy="52" r="8" />
              <circle cx="43" cy="52" r="8" />
            </g>
            <path
              d="m23 28 4-3m12 13 4-3"
              stroke="#e3a3af"
              stroke-width="3"
              stroke-linecap="round"
            /></svg
          ><span>פרי</span></button
        ><button class="tool" id="feeder-tool" data-tool="feeder" hidden aria-label="קערת הסחה — הניחו ואז מלאו בעלה או פרי">
          <svg viewBox="0 0 72 64" aria-hidden="true"><ellipse cx="36" cy="42" rx="27" ry="13" fill="#89643c"/><path d="M9 40q4 24 27 20 22 1 27-20" fill="#b79863" stroke="#6b522f" stroke-width="2"/><ellipse cx="36" cy="39" rx="23" ry="9" fill="#e0c58d"/><path d="M22 38Q24 15 45 19q1 20-23 19Z" fill="#719b47" stroke="#436332" stroke-width="2"/><path d="m24 37 17-13" stroke="#c8d992" stroke-width="2"/></svg><span>קערת הסחה</span>
        </button><button class="tool" id="calm-tool" data-tool="calm" hidden aria-label="פרח הרגעה — מאט זמנית חיות סמוכות">
          <svg viewBox="0 0 72 64" aria-hidden="true"><path d="M35 55V29M34 50Q10 53 17 35q16 0 17 15M37 51q23 2 18-16-15 0-18 16" stroke="#4a713d" stroke-width="3" fill="#749b53"/><g fill="#f9efcf" stroke="#bba568" stroke-width="1.5"><ellipse cx="36" cy="16" rx="7" ry="12"/><ellipse cx="48" cy="24" rx="12" ry="7" transform="rotate(-28 48 24)"/><ellipse cx="43" cy="36" rx="7" ry="12" transform="rotate(-26 43 36)"/><ellipse cx="27" cy="35" rx="7" ry="12" transform="rotate(28 27 35)"/><ellipse cx="23" cy="23" rx="12" ry="7" transform="rotate(28 23 23)"/></g><circle cx="36" cy="27" r="7" fill="#d5a546"/></svg><span>פרח הרגעה</span>
        </button><small>גררו אל הדשא · אפשר גם לבחור ואז להקיש</small>
      </footer>
      <div id="drag-token" hidden></div>
      <div id="modal" hidden role="dialog" aria-modal="true">
        <article id="modal-body"></article>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
